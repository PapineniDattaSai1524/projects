<!DOCTYPE html>
<html>
    <head>
        <title>Calculator</title>
        
    </head>
<body bgcolor="#6699FF">
 
    <div class="t">

     <div class="input"><p id="y"></p></p></div>

        <div class="x">   
        
        <button class="Symbols" onclick="xx()">AC</button>
        <button class="Symbols" onclick="back()" >C</button>
        <button class="Symbols" onclick="root()" >&#8730</button>
        <button class="Symbols" onclick="btn('/')">/</button>


        <button onclick="btn(1)">1</button>
        <button onclick="btn(2)">2</button>
        <button onclick="btn(3)">3</button>
        <button class="Symbols" onclick="btn('*')" >*</button>


        <button onclick="btn(4)">4</button>
        <button onclick="btn(5)">5</button>
        <button onclick="btn(6)">6</button>
        <button class="Symbols" onclick="btn('-')">-</button>

        <button onclick="btn(7)">7</button>
        <button onclick="btn(8)">8</button>
        <button onclick="btn(9)">9</button>
        <button class="Symbols" onclick="btn('+')">+</button>


        <button class="Symbols" onclick="btn('%')">%</button>
        <button onclick="btn(0)">0</button>
        <button class="Symbols" onclick="btn('.')">.</button>
        <button class="Symbols" onclick="ans()">=</button>
        </div>
    </div>
    <div class="NOTE">
        <p id="bs"><b><big><em>NOTE:</em></big></b>
            <ul>
                <li>To Apply Root Use <b>"$"</b> Key After Value</li>
                <li>Use <b>"DELETE"</b> Key to Clear Entire Value</li>
            </ul>
        </p>
    </div>
   <Script>
    let temp;
    
    function btn(a){  
       document.getElementById("y").innerHTML=document.getElementById("y").innerHTML+a; 
       his=document.getElementById("y").innerHTML;
       obj.funValue(his);
    }
    function ans(){
        
        result=eval(document.getElementById("y").innerHTML);
        document.getElementById("y").innerHTML=result;
        obj.funAns(result);
    }
    function back(){
        let x= String (document.getElementById("y").innerHTML);
        document.getElementById("y").innerHTML=x.slice(0,x.length-1);
    }
    function xx(){
        
        document.getElementById("y").innerHTML="";
    }
    function root(){
        let value=document.getElementById("y").innerHTML
        document.getElementById("y").innerHTML=Math.sqrt(value);

    }
    
    
    document.addEventListener("keyup", function clickl(){
        let a=event.key
        
        if(!isNaN(a)||a==='/'||a==='+'||a==='-' ||a==='*'||a==='.'||a==='%'){
            btn(a);
        }
        else if(a==='Enter'){
            ans();
        }
        else if(a === "Backspace"){
            back();
        } 
        else if(a === "Delete"){
            xx();
        }   
        else if(a === '$')
        {
            root();
        }     
} );
    
    
   </Script>
 
</body>
</html>
