<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Speed Calculator</title>
    
    <style>
       
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a; 
            color: #f1f5f9;       
            display: flex;            
            align-items: center;   
            justify-content: center; 
            min-height: 100vh;        
            margin: 0;
            padding: 1rem;
        }

       
        #main-container {
            background-color: #1e293b; 
            padding: 2rem;
            border-radius: 1rem; 
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25); 
            width: 100%;
            max-width: 48rem; /* 768px */
        }

       
        h1 {
            font-size: 2rem;
            font-weight: bold;
            text-align: center;
            color: #60a5fa;
            margin-bottom: 1.5rem;
        }

       
        #difficulty-selection {
            text-align: center;
            padding: 2rem 0;
        }

        #difficulty-selection h2 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
        }
        
      
        #difficulty-buttons {
            display: flex;
            flex-direction: column; 
            gap: 1rem;
            align-items: center;
        }

       
        .difficulty-btn {
            color: white;
            font-weight: bold;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            border: none;
            cursor: pointer;
            width: 50%;
            min-width: 200px;
            transition: all 0.2s;
        }
        .difficulty-btn:hover {
            opacity: 0.8; 
        }

       
        #easy-btn { background-color: #166534;  }
        #medium-btn { background-color: #a16207; }
        #hard-btn { background-color: #991b1b;  }


     
        #metrics-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr); 
            gap: 1rem;
            text-align: center;
            margin-bottom: 1.5rem;
        }

      
        .metric-box {
            background-color: #334155; 
            padding: 1rem;
            border-radius: 0.5rem;
        }

        
        .metric-box .label {
            font-size: 0.875rem;
            color: #94a3b8; 
            text-transform: uppercase;
        }

        
        .metric-box .value {
            font-size: 1.875rem;
            font-weight: bold;
            display: block; 
        }
        
        #timer { color: #93c5fd; }
        #accuracy { color: #86efac; }
        #errors { color: #f87171; }
        #backspace { color: #facc15; }
        
       
        #text-wrapper {
            position: relative;
            margin-bottom: 1rem;
        }

        #text-to-type {
            background-color: #0f172a; 
            padding: 1rem;
            border-radius: 0.5rem;
            color: #94a3b8; 
            font-size: 1.25rem;
            line-height: 1.75;
            min-height: 100px;
        }

      
        #input-area {
            position: absolute; 
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            
            /* Make it invisible */
            background: transparent;
            color: transparent;
            border: none;
            outline: none;
            
            
            resize: none;
            -moz-appearance: textfield; 
            
           
            padding: 1rem;
            font-size: 1.25rem;
            line-height: 1.75;
            font-family: Arial, sans-serif;
            
          
            caret-color: transparent;
        }

      

       
        .correct {
            color: #22c55e; 
        }
        
       
        .incorrect {
            color: #ef4444; 
            text-decoration: underline;
        }
        
        
        .cursor {
            border-bottom: 3px solid #60a5fa; 
            animation: blink 1s infinite;
        }
       
        @keyframes blink {
            0%, 100% { border-bottom-color: transparent; } 
            50% { border-bottom-color: #60a5fa; } 
        }
        
       
        #result-message {
            margin-top: 1.5rem;
            padding: 1rem;
            background-color: #15803d;
            color: white;
            text-align: center;
            border-radius: 0.5rem;
        }

       
        #button-container {
            text-align: center;
            min-height: 50px; 
            margin-top: 1rem;
        }

        
        #retry-btn {
            background-color: #475569; 
            color: white;
            font-weight: bold;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }
        #retry-btn:hover {
            background-color: #334155;
        }
        
        
        #back-btn {
            background-color: #475569; 
            color: white;
            font-weight: bold;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            margin-right: 0.5rem; 
        }
        #back-btn:hover {
            background-color: #334155;
        }
        
       
        .hidden {
            display: none; 
        }

      
        @media (max-width: 640px) {
            
            #metrics-grid {
                grid-template-columns: 1fr;
            }
            .difficulty-btn {
                width: 80%;
            }
        }
        
       
        @media (min-width: 640px) {
           
            #metrics-grid {
                grid-template-columns: repeat(4, 1fr);
            }
          
            #difficulty-buttons {
                flex-direction: row;
                justify-content: center;
            }
            .difficulty-btn {
                width: auto;
            }
        }

    </style>
</head>
<body>

   
    <div id="main-container">
        <h1>Typing Speed Calculator</h1>

       
        <div id="difficulty-selection">
            <h2>Select Your Difficulty</h2>
            <div id="difficulty-buttons">
                <button id="easy-btn" class="difficulty-btn">Easy (60s)</button>
                <button id="medium-btn" class="difficulty-btn">Medium (60s)</button>
                <button id="hard-btn" class="difficulty-btn">Hard (90s)</button>

        </div>

     
        <div id="typing-test-container" class="hidden">
            
           
            <div id="metrics-grid">
                <div class="metric-box">
                    <span class="label">Time</span>

                </div>
                <div class="metric-box">
                    <span class="label">Errors</span>
                    <span class="value" id="errors">0</span>
                </div>
                <div class="metric-box">
                    <span class="label">Backspace</span>
                    <span class="value" id="backspace">0</span>
                </div>
                <div class="metric-box">
                    <span class="label">Accuracy</span>
                    <span class="value" id="accuracy">0%</span>
                </div>
            </div>

           
            <div id="text-wrapper">
                
                <div id="text-to-type">
                  
                </div>
                
                <textarea id="input-area" autofocus></textarea>
            </div>
            
            <div id="button-container">
                <button id="back-btn">Back</button>
                <button id="retry-btn" class="hidden">Retry</button>
            </div>
        </div>

        <div id="result-message" class="hidden">
        </div>

    </div>

            };

            
            // Screens
            const difficultySelectionScreen = document.getElementById('difficulty-selection');
            const typingTestScreen = document.getElementById('typing-test-container');
            
            // Difficulty Buttons
            const easyButton = document.getElementById('easy-btn');
            const mediumButton = document.getElementById('medium-btn');
            const hardButton = document.getElementById('hard-btn');

            // Test Area Elements
            const textDisplayBox = document.getElementById('text-to-type');
            const hiddenTypingArea = document.getElementById('input-area');
            
            // Metric Displays (the text for "Time", "Errors", etc.)
            const timerText = document.getElementById('timer');
            const errorsText = document.getElementById('errors');
            const backspaceText = document.getElementById('backspace');
            const accuracyText = document.getElementById('accuracy');
            
            // Result/Retry Elements
            const retryButton = document.getElementById('retry-btn');
            const resultMessageBox = document.getElementById('result-message');
            const backButton = document.getElementById('back-btn');


          
            
            let timeLimit = 60;          // Default time. This will change based on difficulty.
            let countdownTimer;          // This will hold our 1-second timer.
            let secondsLeft = 0;         // How many seconds are left on the clock.
            let isTestRunning = false;   // Is the test active? (true/false)
            let charactersTypedSoFar = 0;// Total characters the user has typed.
            let totalErrors = 0;         // Number of incorrect characters.
            let totalBackspaces = 0;     // Number of times backspace was pressed.
            let currentTextToType = "";  // The sample text for the current test.
            let selectedDifficulty = "easy"; // The chosen difficulty.


           
            function showDifficultyScreen() {
              
                clearInterval(countdownTimer); 
                isTestRunning = false;
                
              
                resultMessageBox.classList.add('hidden');
                typingTestScreen.classList.add('hidden');
                retryButton.classList.add('hidden');
                backButton.classList.add('hidden');
                difficultySelectionScreen.classList.remove('hidden');
            }
            
           
            function startTest(difficulty) {
                selectedDifficulty = difficulty; 
                
                if (difficulty === 'hard') {
                    timeLimit = 90; 
                } else {
                    timeLimit = 60;
                }
                
                difficultySelectionScreen.classList.add('hidden');
                typingTestScreen.classList.remove('hidden');
                backButton.classList.remove('hidden');
                resetTest(); 
            }

            function resetTest() {
                clearInterval(countdownTimer);
                isTestRunning = false;
                secondsLeft = timeLimit; 
                charactersTypedSoFar = 0;
                totalErrors = 0;
                totalBackspaces = 0; 

                timerText.innerText = secondsLeft; 
                errorsText.innerText = '0';
                backspaceText.innerText = '0';
                accuracyText.innerText = '0%';
                
                hiddenTypingArea.value = '';
                hiddenTypingArea.disabled = false;
                
                resultMessageBox.classList.add('hidden');
                retryButton.classList.add('hidden');
                
                backButton.classList.remove('hidden');

                loadNewText(); 
                
             
                hiddenTypingArea.focus();
            }
            function loadNewText() {
                const texts = sampleTexts[selectedDifficulty];
                
                
                const randomIndex = Math.floor(Math.random() * texts.length);
                
                currentTextToType = texts[randomIndex];
                
                textDisplayBox.innerHTML = '';
                
                const characters = currentTextToType.split('');
                
                characters.forEach((char, index) => {
                    const span = document.createElement('span');
                    span.innerText = char;
                    if (index === 0) {
                        span.classList.add('cursor'); 
                    }
                    
                    textDisplayBox.appendChild(span);
                });
            }

          
            function checkTyping() {
              
                if (!isTestRunning && secondsLeft === 0) return;

             
                const typedText = hiddenTypingArea.value; 
                const textLength = typedText.length;

               
                if (!isTestRunning && textLength > charactersTypedSoFar) { 
                    beginCountdown();
                }

                const textSpans = textDisplayBox.querySelectorAll('span');
                
                charactersTypedSoFar = textLength;
                let currentErrors = 0; 
                let currentCursorPos = charactersTypedSoFar; 

               
                textSpans.forEach((span, index) => {
                    const typedChar = typedText[index];
                    const sourceChar = span.innerText; 

                   
                    span.className = '';

                    if (typedChar === undefined) {
                       
                    } else if (typedChar === sourceChar) {
                       
                        span.classList.add('correct');
                    } else {
                       
                        span.classList.add('incorrect');
                        currentErrors++; 
                    }
                });

               
                if (currentCursorPos < textSpans.length) {
                    textSpans[currentCursorPos].classList.add('cursor');
                }

               
                totalErrors = currentErrors;
                errorsText.innerText = totalErrors;
                updateAccuracy(); // Recalculate and show the new accuracy

                // 5. Check if the user has finished typing the entire text
                if (charactersTypedSoFar === currentTextToType.length) {
                    finishTest(); // End the test (even if time isn't up)
                }
            }
            
           
            function checkKeypress(event) {
                if (event.key === 'Backspace' && isTestRunning) {
                    totalBackspaces++; 
                    backspaceText.innerText = totalBackspaces; 
                    
                    
                    updateAccuracy(); 
                }
            }

         


            function updateAccuracy() {

                const correctTyped = charactersTypedSoFar - totalErrors;

                const accuracyPercent = charactersTypedSoFar === 0 ? 0 : (correctTyped / charactersTypedSoFar) * 100;
      
                const backspacePenalty = totalBackspaces * 0.5;
                
              
                const finalAccuracy = Math.max(0, accuracyPercent - backspacePenalty);
                
               
                accuracyText.innerText = `${Math.round(finalAccuracy)}%`;
            }

            
            function beginCountdown() {
                isTestRunning = true; // The test is now running!
                
               
                countdownTimer = setInterval(() => {
                    secondsLeft--;
                    timerText.innerText = secondsLeft; 
                    
                   
                    if (secondsLeft === 0) {
                        finishTest(); 
                    }
                }, 1000); 
            }

           
            function finishTest() {
               
                clearInterval(countdownTimer);
                isTestRunning = false;
                
                
                hiddenTypingArea.disabled = true;

               
                backButton.classList.add('hidden');

                                const cursorSpan = textDisplayBox.querySelector('.cursor');
                if (cursorSpan) {
                    cursorSpan.classList.remove('cursor');
                }

                // --- Calculate Final Stats ---
                const finalAccuracy = accuracyText.innerText;
                const finalErrors = totalErrors;
                const finalBackspace = totalBackspaces;
                const finalTypedChars = charactersTypedSoFar;
                const totalSourceChars = currentTextToType.length;
                const correctTyped = finalTypedChars - finalErrors;
                
                // Calculate the actual time spent.
                const timeSpent = timeLimit - secondsLeft;

                // Calculate CPM (Characters Per Minute).
                // Convert time to minutes (e.g., 60s -> 1.0m, 90s -> 1.5m).
                const timeSpentInMinutes = timeSpent / 60;
                // CPM = (Correct Characters) / (Time in Minutes)
                const cpm = (timeSpentInMinutes > 0) ? Math.round(correctTyped / timeSpentInMinutes) : 0;

                // Calculate the "Attempt" percentage (how much of the text they finished).
                const finalCharsPercentage = totalSourceChars > 0 ? 
                    Math.round((finalTypedChars / totalSourceChars) * 100) : 0;

                // Create the HTML for the result message.
                resultMessageBox.innerHTML = `
                    <strong style="font-size: 1.25rem;">Test Complete!</strong><br>
                    <div style="text-align: left; display: inline-block; margin-top: 1rem; line-height: 1.75;">
                        Time Spent: &nbsp;<strong>${timeSpent}s</strong><br>
                        CPM: &nbsp;<strong>${cpm}</strong> (Chars Per Minute)<br>
                        Errors: &nbsp;<strong>${finalErrors}</strong><br>
                        Backspaces: &nbsp;<strong>${finalBackspace}</strong><br>
                        Accuracy: &nbsp;<strong>${finalAccuracy}</strong><br>
                        Attempt: &nbsp;<strong>${finalCharsPercentage}%</strong> (${finalTypedChars} / ${totalSourceChars})
                    </div>
                `;
                
                
                resultMessageBox.classList.remove('hidden');
                retryButton.classList.remove('hidden');
            }
            easyButton.addEventListener('click', () => startTest('easy'));
            mediumButton.addEventListener('click', () => startTest('medium'));
            hardButton.addEventListener('click', () => startTest('hard'));
            
           
            retryButton.addEventListener('click', showDifficultyScreen);
            backButton.addEventListener('click', showDifficultyScreen);
            
            hiddenTypingArea.addEventListener('input', checkTyping);
            hiddenTypingArea.addEventListener('keydown', checkKeypress);
   
            textDisplayBox.addEventListener('click', () => {
                hiddenTypingArea.focus();
            });

           
            showDifficultyScreen();
        });
    </script>
</body>
</html>
